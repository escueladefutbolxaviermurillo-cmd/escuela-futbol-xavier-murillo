<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Escuela De Fútbol Xavier Murillo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fondo con la imagen propia de la escuela */
            background: linear-gradient(rgba(13, 27, 42, 0.4), rgba(13, 27, 42, 0.4)),
                        url("{{ url_for('static', filename='img/fondo-login.png') }}") center/cover no-repeat fixed;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
            width: 100%;
            max-width: 410px;
            padding: 2.5rem 2.2rem;
        }

        .logo-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.12));
        }

        .school-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0b2545;
            margin-top: 0.75rem;
            margin-bottom: 0.15rem;
            line-height: 1.25;
        }

        .school-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }

        .custom-input {
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            background-color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
        }

        .password-toggle-btn {
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: #64748b;
        }

        .password-toggle-btn:hover {
            color: #0284c7;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0d6efd, #004ecc);
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 14px rgba(13, 110, 253, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center px-3">
    <div class="login-card text-center">

        <!-- Logo Central -->
        <div>
            <img src="{{ url_for('static', filename='img/logo.png') }}" 
                 alt="Logo Escuela de Fútbol Xavier Murillo" 
                 class="logo-img"
                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/861/861512.png';">
        </div>

        <!-- Título Institucional -->
        <h2 class="school-title">Escuela De Fútbol<br>Xavier Murillo</h2>
        <div class="school-subtitle">Ingreso al sistema</div>

        <!-- Alertas Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show text-start py-2 px-3 small rounded-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario de Acceso -->
        <form action="{{ url_for('auth.login') }}" method="POST" class="text-start">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" 
                       class="form-control custom-input" 
                       id="username" 
                       name="username" 
                       placeholder="ej: admin o tu cédula" 
                       required 
                       autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" 
                           class="form-control custom-input border-end-0" 
                           id="password" 
                           name="password" 
                           placeholder="••••••••••••" 
                           required>
                    <button class="btn password-toggle-btn" type="button" onclick="togglePasswordVisibility()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit w-100 text-white">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
    }
}
</script>

</body>
</html>
