{% extends 'base.html' %}

{% block title %}Registrar Jugador - Escuela FC{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">⚽ Nuevo Jugador</h3>
            <a href="{{ url_for('players.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver a la lista
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form action="{{ url_for('players.create') }}" method="POST">
                    <!-- Datos del Alumno -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person me-1"></i> Datos del Jugador</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Nombres</label>
                            <input type="text" name="first_name" class="form-control" placeholder="Ej. Carlos Andrés" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Apellidos</label>
                            <input type="text" name="last_name" class="form-control" placeholder="Ej. Mendoza Vera" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Cédula / Identificación</label>
                            <input type="text" name="identification_id" class="form-control" placeholder="0987654321" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Fecha de Nacimiento</label>
                            <input type="date" name="birth_date" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Categoría Asignada</label>
                            <select name="category_id" class="form-select" required>
                                <option value="" disabled selected>Selecciona una categoría...</option>
                                {% for cat in categories %}
                                    <option value="{{ cat._id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Observaciones Médicas / Físicas</label>
                            <input type="text" name="medical_notes" class="form-control" placeholder="Alergias, asma, etc. (Opcional)">
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Datos del Representante -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person-badge me-1"></i> Datos del Representante</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" name="rep_name" class="form-control" placeholder="Ej. Juan Mendoza" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Cédula Representante</label>
                            <input type="text" name="rep_id" class="form-control" placeholder="0912345678" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Teléfono / WhatsApp</label>
                            <input type="tel" name="rep_phone" class="form-control" placeholder="+593 99..." required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" name="rep_email" class="form-control" placeholder="representante@email.com">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('players.index') }}" class="btn btn-light border px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Guardar Jugador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
